name: cloud-worker

# Unattended discovery + application worker. Independent of any personal computer.
# Scheduled runs are DRY RUNS (nothing is submitted) unless the repository variable CLOUD_LIVE is set to 'true'; manual runs default to a DRY RUN unless dry_run is switched off.
on:
  schedule:
    - cron: "15 12 * * *"        # daily, 12:15 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fills nothing live, submits nothing)"
        type: boolean
        default: true
      test_notification:
        description: "Only send one test notification to the phone, then stop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        if: ${{ github.event_name == 'schedule' || inputs.test_notification != true }}
        run: pnpm --filter @ros/workers exec playwright install --with-deps chromium

      - name: Run worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ROS_APP_URL: https://recruiting-os-tau.vercel.app
          DRY: ${{ github.event_name == 'schedule' && (vars.CLOUD_LIVE == 'true' && 'false' || 'true') || (inputs.dry_run && 'true' || 'false') }}
          TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification && 'true' || 'false' }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            ./node_modules/.bin/tsx apps/web/scripts/cloud-worker.ts --test-notification
            exit $?
          fi
          ARGS="--once --max-minutes 25"
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          ./node_modules/.bin/tsx apps/web/scripts/cloud-worker.ts $ARGS
